name: Kerjo CI

on:
  push:
    branches: [main, feat/kerjo-m1-m4-reliability-workflow]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend unit and integration tests
        env:
          PYTHONPATH: apps/api
        run: python -m unittest discover -s apps/api/tests -p 'test_*.py' -v
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
